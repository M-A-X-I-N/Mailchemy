name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.20.0

      - name: Verify toolchain
        shell: bash
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run canonical validation
        run: npm run check

      - name: Show formatter diff after validation failure
        if: failure()
        shell: bash
        run: |
          npm run format
          git diff -- .
